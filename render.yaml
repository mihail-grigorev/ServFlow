services:
  - type: web
    name: servflow
    runtime: docker
    plan: free
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: SYSTEM_REFERENCE_DATE
        value: "2026-11-16T11:30:00"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
